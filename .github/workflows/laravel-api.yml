name: Laravel API
on:
  push:
    paths:
      - 'laravel/**'
      - 'src/**'
      - '.github/workflows/laravel-api.yml'
  pull_request:
    paths:
      - 'laravel/**'
      - 'src/**'
      - '.github/workflows/laravel-api.yml'
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: composer test
